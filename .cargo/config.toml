# 交叉编译到 aarch64-linux-android 的公共参数。
#
# 链接器路径因人而异，不写死在这里——构建前设置环境变量，或直接用
# scripts/build-android.sh（它会按 uname 自动挑 NDK 的 host 目录）：
#
#   export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$NDK/toolchains/llvm/prebuilt/<host>/bin/clang
#
# API 等级与 popsicle 的原厂 ramdisk 一致（Android 15 / API 35 的内核，用户态按 30 链接）。

[target.aarch64-linux-android]
rustflags = ["-C", "link-arg=--target=aarch64-linux-android30"]

# 国内镜像；不在中国大陆时把下面三节删掉即可。
[source.crates-io]
replace-with = 'rsproxy-sparse'

[source.rsproxy-sparse]
registry = "sparse+https://rsproxy.cn/index/"

[registries.rsproxy]
index = "sparse+https://rsproxy.cn/index/"

[net]
git-fetch-with-cli = true
